<form method="post" action="{% url 'admin:sales_pos_customer_form' %}" id="pos-customer-form" novalidate>
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div style="background:#fee2e2;color:#991b1b;padding:0.75rem 1rem;border-radius:0.375rem;margin-bottom:1rem;font-size:0.9rem;">
            {{ form.non_field_errors.0 }}
        </div>
    {% endif %}

    {% for field in form %}
        <div class="pos-form-row">
            <label for="{{ field.id_for_label }}">
                {{ field.label }}
                {% if field.field.required %}<span style="color:#dc2626;">*</span>{% endif %}
            </label>
            {{ field }}
            {% if field.errors %}
                <div class="pos-form-error">{{ field.errors.0 }}</div>
            {% endif %}
        </div>
    {% endfor %}

    <div class="pos-form-submit">
        <button type="submit">Guardar</button>
    </div>
</form>
