{% extends "admin/base_site.html" %}
{% load static i18n %}

{% block extrahead %}
    {{ block.super }}
    <style>
        #company-test-selector {
            background: #dc3545 !important;
            color: #fff !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            font-size: 16px !important;
            position: fixed !important;
            top: 10px !important;
            right: 10px !important;
            z-index: 999999 !important;
            border: 3px solid #ff0 !important;
        }
    </style>
{% endblock %}

{% block footer %}
    {{ block.super }}
    
    <script>
        (function() {
            console.log("🔴 Inyectando selector en el body...");
            
            // ✅ Crear un elemento de prueba muy visible
            var testDiv = document.createElement('div');
            testDiv.id = 'company-test-selector';
            testDiv.innerHTML = '🔴 SELECTOR DE COMPAÑÍAS AQUÍ';
            document.body.appendChild(testDiv);
            
            console.log("✅ Elemento de prueba creado");
        })();
    </script>
{% endblock %}
