{# django_erp/templates/admin/base_site.html #}
{% extends "admin/base_site.html" %}
{% load i18n static %}
{% load static %}

{% block extrahead %}
    {{ block.super }}

    {# ✅ ERP_CONFIG: ÚNICA inyección, vía JSON serializado desde la vista #}
    <script>
        window.ERP_CONFIG = {{ ERP_CONFIG_JSON|safe }};
        console.log('✅ ERP_CONFIG inyectado:', window.ERP_CONFIG);
    </script>

    <style>
        .company-selector-injected {
            display: inline-block;
            margin-right: 15px;
            vertical-align: middle;
        }
        .company-selector-injected select {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            cursor: pointer;
            min-width: 180px;
            max-width: 250px;
        }
        .company-selector-injected select option {
            color: #333;
            background: #fff;
        }
        .dark .company-selector-injected select {
            background: rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.15);
            color: #fff;
        }
        .dark .company-selector-injected select option {
            color: #fff;
            background: #1a1a1a;
        }
        .company-selector-injected .badge {
            background: #0d6efd;
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function injectSelector() {
                var userTools = document.getElementById('user-tools');
                if (!userTools) {
                    setTimeout(injectSelector, 200);
                    return;
                }

                if (userTools.querySelector('.company-selector-injected')) {
                    return;
                }

                var companies = {{ available_companies|safe|default:'[]' }};
                var currentId = {{ current_company.id|default:'null' }};

                if (!companies || companies.length < 2) {
                    return;
                }

                var wrapper = document.createElement('span');
                wrapper.className = 'company-selector-injected';

                var form = document.createElement('form');
                form.method = 'get';
                form.id = 'company-selector-injected-form';
                form.style.display = 'inline';

                var select = document.createElement('select');
                select.name = 'company_id';
                select.onchange = function() {
                    this.closest('form').submit();
                };

                companies.forEach(function(company) {
                    var option = document.createElement('option');
                    option.value = company.id;
                    if (String(company.id) === String(currentId)) {
                        option.selected = true;
                    }
                    option.textContent = company.name + ' (' + company.code + ')';
                    select.appendChild(option);
                });

                form.appendChild(select);
                wrapper.appendChild(form);

                if (currentId) {
                    var badge = document.createElement('span');
                    badge.className = 'badge';
                    var current = companies.find(function(c) {
                        return String(c.id) === String(currentId);
                    });
                    if (current) {
                        badge.textContent = current.code;
                        wrapper.appendChild(badge);
                    }
                }

                userTools.insertBefore(wrapper, userTools.firstChild);
            }

            setTimeout(injectSelector, 100);
            setTimeout(injectSelector, 300);
            setTimeout(injectSelector, 600);
        });
    </script>
{% endblock %}
